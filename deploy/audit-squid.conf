# The audit check container receives this proxy through HTTP(S)_PROXY. It may
# fetch integrity-pinned packages from the public npm registry and nothing
# else. The proxy itself is the only container attached to the egress network.

acl CONNECT method CONNECT
acl SSL_ports port 443
acl npm_registry dstdomain .registry.npmjs.org

# Deny loopback, RFC1918, carrier-grade NAT, link-local/metadata, benchmark,
# multicast, and IPv6 local/private ranges before considering the hostname
# allow-list. This keeps a DNS answer from turning an allowed request into an
# internal-network request.
acl private_dest dst 0.0.0.0/8
acl private_dest dst 10.0.0.0/8
acl private_dest dst 100.64.0.0/10
acl private_dest dst 127.0.0.0/8
acl private_dest dst 169.254.0.0/16
acl private_dest dst 172.16.0.0/12
acl private_dest dst 192.0.0.0/24
acl private_dest dst 192.0.2.0/24
acl private_dest dst 192.168.0.0/16
acl private_dest dst 198.18.0.0/15
acl private_dest dst 198.51.100.0/24
acl private_dest dst 203.0.113.0/24
acl private_dest dst 224.0.0.0/4
acl private_dest dst 240.0.0.0/4
acl private_dest dst ::1/128
acl private_dest dst fc00::/7
acl private_dest dst fe80::/10
acl private_dest dst ff00::/8

http_access deny private_dest
http_access deny to_localhost
http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow npm_registry
http_access deny all

http_port 3128
access_log none
cache_log /dev/null
cache deny all
via on
forwarded_for delete
request_header_access X-Forwarded-For deny all
